name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@1d0ff465b7ec7b808d00122d4a20b7c413b584a2 # v4.2.0
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Tarepet app
        run: |
          pnpm --filter "@workspace/tarepet" build
          cp artifacts/tarepet/dist/public/index.html artifacts/tarepet/dist/public/404.html
        env:
          BASE_PATH: /
          NODE_ENV: production
          VITE_API_URL: https://tarepetlms.onrender.com/api/v1
          VITE_PAYSTACK_PUBLIC_KEY: pk_test_0cebdc3e1ca9d0ef71d0aa988c85be3675a7a675

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c1b8555810237953282136e4 # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/tarepet/dist/public
          publish_branch: gh-pages
          cname: tarepetmontessorischool.com
