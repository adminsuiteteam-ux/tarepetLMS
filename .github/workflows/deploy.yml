name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack & pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Tarepet app
        run: |
          pnpm --filter "@workspace/tarepet" build
          cp artifacts/tarepet/dist/public/index.html artifacts/tarepet/dist/public/404.html
        env:
          BASE_PATH: /tarepetwebapp/
          NODE_ENV: production
          VITE_API_URL: https://tarepet-backend.onrender.com/api/v1

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/tarepet/dist/public
          publish_branch: gh-pages
