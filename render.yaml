services:
  - type: web
    name: tarepet-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1,tarepetmontessorischool.com,www.tarepetmontessorischool.com"
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        value: "tarepetm@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        value: "Tarepet Montessori School <tarepetm@gmail.com>"
      - key: ACCESS_TOKEN_LIFETIME_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_LIFETIME_DAYS
        value: "7"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: MALLOC_TRIM_THRESHOLD_
        value: "100000"

  - type: web
    name: tarepet-frontend
    env: static
    buildCommand: "npm install -g pnpm@9.15.0 && pnpm install --no-frozen-lockfile && pnpm --filter \"@workspace/tarepet\" run build"
    staticPublishPath: "./artifacts/tarepet/dist/public"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        value: "https://tarepet-backend-4iw6.onrender.com/api/v1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://tarepetmontessorischool.com,https://www.tarepetmontessorischool.com,https://tarepet-frontend.onrender.com,http://localhost:5173,http://localhost:3000"
      - key: NODE_VERSION
        value: "20.18.0"
